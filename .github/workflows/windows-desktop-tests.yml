name: Windows desktop tests

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python validators
        run: python -m pip install pillow jsonschema numpy

      - name: Build Windows solution
        run: dotnet build Wukong.sln --configuration Release

      - name: Run .NET console test suites
        shell: pwsh
        run: |
          $projects = @(
            "tests/Wukong.Domain.Tests/Wukong.Domain.Tests.csproj",
            "tests/Wukong.Contracts.Tests/Wukong.Contracts.Tests.csproj",
            "tests/Wukong.Application.Tests/Wukong.Application.Tests.csproj",
            "tests/Wukong.Infrastructure.Tests/Wukong.Infrastructure.Tests.csproj",
            "tests/Wukong.Desktop.Tests/Wukong.Desktop.Tests.csproj"
          )
          foreach ($project in $projects) {
            dotnet run --project $project --configuration Release --no-build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run asset and contract tests
        run: python -m unittest discover -s tests -v

      - name: Publish self-contained autonomous daily review package
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/agent/personality-state-behavior-mock-v1'
        shell: pwsh
        run: ./tools/publish-autonomous-daily-review.ps1 -Configuration Release -RuntimeIdentifier win-x64

      - name: Upload autonomous daily Windows review package
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/agent/personality-state-behavior-mock-v1'
        uses: actions/upload-artifact@v4
        with:
          name: wukong-autonomous-daily-review-win-x64-${{ github.run_number }}
          path: .publish-check/autonomous-daily-review-v1
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
